<title>Bolmo Explainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive walk through Bolmo: how Minixhofer et al. (Nature, 2026) retrofit a subword language model to read and write raw bytes.">
<style>
/* Layout: a lab notebook. One wide explorer (byte columns on a grid, a notes panel beside it), then narrow reading sections, each with one control. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --rule:#cfd6df; --grid:#dde3ea;
  --ink:#131820; --ink-2:#3b4552; --ink-3:#5d6876;
  --bound:#d6336c; --bound-tint:#fbe3ec;      /* the patch boundary <b>: the one loud colour */
  --sel:#1f5fbf; --sel-tint:#dfe9f8;          /* the selected byte column */
  --shadow:rgba(16,26,40,.26); --frozen:#8a94a1; --kept:#3b4552; --new:#0f7c86; --new-tint:#dcf0f1;
  --p0:#7a8594; --p1:#2f7d5b; --p2:#b8741a; --p3:#2c64b0; --p4:#8a4fbf; --p5:#a8435e; /* patch colours, cycled */
  --ok:#2f7d5b; --no:#c0392b;
  --display:"Iowan Old Style","Charter","Bitstream Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --cell:34px; --r:8px; --wrap:1240px; --read:72ch;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shadow:rgba(0,0,0,.6); --kept:#b9c3cf; --new:#4fc3cc; --new-tint:#163236; --bg:#12161c; --surface:#1a2028; --sunk:#222a34; --rule:#333d4a; --grid:#29313c;
  --ink:#e8edf3; --ink-2:#b9c3cf; --ink-3:#8d99a7;
  --bound:#ff6b9a; --bound-tint:#3d1d2a; --sel:#6fa4f2; --sel-tint:#1e2d44; --frozen:#6c7684;
  --p0:#8e98a6; --p1:#57b98d; --p2:#e2a04a; --p3:#6b9ee8; --p4:#b48af0; --p5:#e07a98; --ok:#57b98d; --no:#f07167;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --shadow:rgba(0,0,0,.6); --kept:#b9c3cf; --new:#4fc3cc; --new-tint:#163236; --bg:#12161c; --surface:#1a2028; --sunk:#222a34; --rule:#333d4a; --grid:#29313c;
  --ink:#e8edf3; --ink-2:#b9c3cf; --ink-3:#8d99a7;
  --bound:#ff6b9a; --bound-tint:#3d1d2a; --sel:#6fa4f2; --sel-tint:#1e2d44; --frozen:#6c7684;
  --p0:#8e98a6; --p1:#57b98d; --p2:#e2a04a; --p3:#6b9ee8; --p4:#b48af0; --p5:#e07a98; --ok:#57b98d; --no:#f07167;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:600 clamp(2rem,4.4vw,3.1rem)/1.08 var(--display);letter-spacing:-.01em}
h2{font:600 clamp(1.45rem,2.6vw,1.95rem)/1.18 var(--display)}
h3{font:600 1rem/1.35 var(--sans)}
p{margin:0;max-width:var(--read)}
a{color:inherit;text-underline-offset:3px}
code,.mono{font-family:var(--mono);font-size:.92em}
.label{font:600 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.b{color:var(--bound);font-weight:600}

/* top */
header.top{padding-block:40px 18px}
.kicker{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.lede{font-size:1.1rem;color:var(--ink-2);margin-top:14px;max-width:68ch}
.bits{display:inline-flex;gap:3px;vertical-align:middle;margin-right:2px}
.bits i{width:7px;height:16px;border-radius:2px;background:var(--ink)}
.bits i.z{background:transparent;border:1.5px solid var(--ink-3)}

/* input bar */
.inbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
@media (max-width:700px){.inbar{position:static}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.inbar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:10px}
.field{flex:1 1 360px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--rule);border-radius:var(--r);padding:0 10px}
.field:focus-within{border-color:var(--sel)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font:500 1rem var(--mono);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font:600 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-3)}

/* sections */
section{padding-block:56px;border-top:1px solid var(--rule)}
section.first{border-top:0;padding-top:28px}
.sec-head{display:grid;gap:10px;margin-bottom:24px}
.sec-head p{color:var(--ink-2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.note{font-size:13px;color:var(--ink-3);margin-top:10px;max-width:var(--read)}

/* hero numbers */
.heads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;margin-top:24px;max-width:960px}
.heads div{border-top:2px solid var(--ink);padding-top:8px;display:grid;gap:2px}
.heads b{font:600 1.45rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.heads b span{font-size:.8rem;color:var(--ink-3);font-weight:400}
.heads > div > span{font-size:13px;color:var(--ink-3)}
@media (max-width:700px){.heads{grid-template-columns:minmax(0,1fr)}}

/* context */
.ctx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}
@media (max-width:900px){.ctx{grid-template-columns:minmax(0,1fr)}}
.story{display:grid;gap:20px}
.story .label{display:block;margin-bottom:4px}
.lanes{display:grid;gap:16px}
.lane .lh{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px;color:var(--ink-2)}
.lane .lh b{color:var(--ink)}
.lane .lh .num{color:var(--ink-3)}
.lt{overflow-wrap:anywhere;font-size:15px}
.hexes{display:flex;flex-wrap:wrap;gap:3px}
.hx{font:11px/1.5 var(--mono);padding:0 4px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.hx.b{color:var(--bound)}
.insight{font-size:14px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:12px;max-width:none}

/* overview: Olmo row above Bolmo row, aligned on the transformer */
.flow{display:grid;grid-template-columns:96px repeat(3,minmax(0,1fr)) minmax(0,1.45fr) repeat(2,minmax(0,1fr));gap:10px;
  grid-template-areas:"lo o1 o1 o1 o2 o3 o3" ". m1 m1 m1 m2 m3 m3" "lb b0 b1 b2 b3 b4 b5";align-items:stretch}
.frow-l{grid-area:lo;display:flex;flex-direction:column;justify-content:center;font:600 15px var(--display)}
.frow-l.bl{grid-area:lb}
.frow-l span{font:12px var(--sans);color:var(--ink-3)}
.fblk{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:8px;border:1.5px solid var(--rule);background:var(--surface);text-align:left;min-width:0;font:inherit;color:inherit}
.fblk b{font:600 15px/1.25 var(--sans)}
.fblk .w{font-size:13px;line-height:1.35;color:var(--ink-2)}
.fblk .st{font-size:12px;color:var(--ink-3)}
.fblk .pv{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-top:2px;font-size:12px;color:var(--ink-3)}
.fblk .pv .tok{font-size:11px;margin:0}
.fblk.olmo{background:var(--sunk);border-style:dashed}
.fblk.olmo.kept{border-style:solid;border-color:var(--kept)}
.fblk.bol{cursor:pointer;border-top:4px solid var(--new);transition:border-color .15s,transform .15s}
.fblk.bol.kept{border-top-color:var(--kept);border-color:var(--kept);background:color-mix(in srgb,var(--kept) 7%,var(--surface))}
.fblk.bol:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.fblk.bol.on{outline:2.5px solid var(--sel);outline-offset:2px}
.zoomi{margin-top:auto;padding-top:6px;font-size:12px;font-weight:600;color:var(--sel)}
.fmid{display:flex;align-items:center;justify-content:center;gap:6px;font:12px var(--mono);color:var(--ink-3);text-align:center;border-left:1.5px dashed var(--rule);border-right:1.5px dashed var(--rule);padding:4px 8px}
.fmid::before{content:"↓";font-size:14px}
.fmid.keep{color:var(--kept);font-weight:600;border-color:var(--kept);border-style:solid}
.flowkey{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.flowkey span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:860px){
  .flow{grid-template-columns:minmax(0,1fr);grid-template-areas:"lo" "o1" "o2" "o3" "lb" "b0" "b1" "b2" "b3" "b4" "b5"}
  .fmid{display:none}
  .frow-l.bl{margin-top:14px}
}

/* zoom */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:14px;font-size:14px}
.crumb{border:0;background:none;padding:2px 0;color:var(--ink-3);font:inherit}
button.crumb{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button.crumb:hover{color:var(--ink)}
.crumb.on{color:var(--ink);font-weight:600}
.sep{color:var(--ink-3)}
.zhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end;margin-bottom:16px}
.zhead h3{font:600 1.5rem/1.2 var(--display);margin:2px 0 6px}
.zhead .navbtns{grid-column:1/-1;flex-wrap:wrap}
.io{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.io i{font-style:normal;font-weight:700;color:var(--new)}
@media (max-width:700px){.zhead{grid-template-columns:minmax(0,1fr)}}

/* in-place expansion: one part opens inside the row, the others shrink to tabs (as in Transformer Explainer) */
.launch{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.flow.exp{grid-template-columns:var(--cols);grid-template-areas:"b0 b1 b2 b3 b4 b5";align-items:stretch}
.flow.exp .frow-l,.flow.exp .fblk.olmo,.flow.exp .fmid{display:none}
.flow.exp .fblk.bol{writing-mode:vertical-rl;padding:12px 0;align-items:center;justify-content:flex-start;gap:0;border-top-width:1.5px;border-left:4px solid var(--new)}
.flow.exp .fblk.bol.kept{border-left-color:var(--kept)}
.flow.exp .fblk.bol:hover{transform:translateX(0);background:var(--sunk)}
.flow.exp .fblk.bol b{font-size:14px;white-space:nowrap}
.flow.exp .fblk.bol .w,.flow.exp .fblk.bol .st,.flow.exp .fblk.bol .pv,.flow.exp .fblk.bol .zoomi{display:none}
.flow.full{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"b0 b1 b2 b3 b4 b5" "fx fx fx fx fx fx"}
.flow.full .fblk.bol{writing-mode:horizontal-tb;padding:8px 12px;border-left-width:1.5px;border-top-width:4px}
.fexp{min-width:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px 16px;border-radius:8px;border:1.5px solid var(--rule);border-top:4px solid var(--new);background:var(--surface);
  box-shadow:0 10px 30px var(--shadow);animation:grow .22s ease-out;transform-origin:center top}
.fexp.kept{border-top-color:var(--kept)}
@keyframes grow{from{opacity:.2;transform:scaleY(.96)}to{opacity:1;transform:none}}
.fx-top{display:flex;align-items:center;gap:12px}
.fx-top .crumbs{flex:1;min-width:0;margin:0}
.iconbtn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--rule);border-radius:7px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--ink-3)}
.fexp .zhead{margin:0}
.fexp .zhead h3{font-size:1.3rem;margin:0 0 4px}
.fexp .zhead p{font-size:15px;line-height:1.5}
.zside{display:grid;gap:8px;justify-items:end}
.btn.sm{padding:4px 10px;font-size:13px}
.fexp .explorer{grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.fexp .stackwrap{background:var(--bg)}
.fexp .panel{position:static;padding:14px;gap:10px;background:var(--bg)}
.fexp .panel h3{font-size:1.1rem}
.fexp .panel p{font-size:14px;line-height:1.5}
.fexp .formula{font-size:13px;padding:8px 10px}
.fexp{--cell:30px}
.fexp .row{padding:4px 0 2px}
.fexp .byte{height:36px}
/* all nine steps: same rows, tighter */
.flow.full .zhead{display:none}
.flow.full .row{padding:2px 0 0}
.flow.full .rowhead{padding:0 12px 2px}
.flow.full .byte{height:32px}
.flow.full .byte .h{margin-top:3px}
.flow.full .suf{height:28px}
.flow.full .vec,.flow.full .dep{height:24px}
.flow.full .vec i,.flow.full .dep i{height:16px}
.flow.full .bnd{height:28px}
.flow.full .bnd.yes i{height:20px}
.flow.full .pat{height:26px}
.flow.full .pat .bar{top:10px}
.flow.full .pat .dot{width:16px;height:16px}
.flow.full .glob{height:40px}
.flow.full .glob .dot{height:24px}
.flow.full .band{top:26px;height:24px}
.flow.full .out{height:34px}
.flow.full .legend{padding-block:6px}
.selbar{padding:8px 12px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2);min-height:3.2em}
.selbar b{color:var(--sel)}
@media (max-width:1100px){.fexp .explorer{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .flow.exp,.flow.full{grid-template-columns:minmax(0,1fr);grid-template-areas:"b0" "b1" "b2" "b3" "b4" "b5" "fx"}
  .flow.exp .fblk.bol{writing-mode:horizontal-tb;padding:8px 12px;border-left-width:4px}
  .fexp{padding:10px}
  .fexp .zhead{grid-template-columns:minmax(0,1fr)}
  .zside{justify-items:start}
}

/* explorer */
.explorer{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.explorer{grid-template-columns:minmax(0,1fr)}}
.stackwrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.stack{overflow-x:auto;padding:10px 0 14px}
.stackin{width:max-content;min-width:100%}
.row{position:relative;padding:6px 0 4px}
.row + .row{border-top:1px dashed var(--grid)}
.rowhead{position:sticky;left:0;display:inline-flex;align-items:baseline;gap:8px;padding:2px 12px 4px;background:transparent;border:0;cursor:pointer;text-align:left;white-space:nowrap}
.rowhead .nm{font:600 13px var(--sans)}
.rowhead .sh{font:12px var(--mono);color:var(--ink-3)}
.rowhead .ix{font:600 11px var(--mono);color:var(--ink-3);width:1.4em}
.row.on{background:var(--sel-tint)}
.row.on .rowhead .nm{color:var(--sel)}
.cells{display:flex;padding:0 12px;width:max-content}
.c{width:var(--cell);flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
.c.sel{background:color-mix(in srgb,var(--sel) 16%,transparent);box-shadow:inset 0 0 0 1.5px var(--sel)}
.c.dim{opacity:.28}
.byte{height:40px}
.byte .g{font:600 15px/1 var(--mono)}
.byte .h{font:10px/1 var(--mono);color:var(--ink-3);margin-top:5px}
.byte .g.ws{color:var(--ink-3)}
.byte.bos .g{font-size:11px;color:var(--ink-3)}
.vec{height:30px}
.vec i{display:block;width:22px;height:20px;border-radius:3px;background:var(--sunk);border:1px solid var(--rule)}
.vec i.ctx{background:color-mix(in srgb,var(--sel) 30%,var(--sunk));border-color:var(--sel)}
.suf{height:44px;justify-content:flex-end;padding-bottom:4px}
.suf i{display:block;width:16px;border-radius:2px 2px 0 0;background:var(--ink-3);opacity:.55}
.suf.sel i{background:var(--sel);opacity:1}
.bnd{height:40px;justify-content:flex-end;padding-bottom:4px}
.bnd i{display:block;width:6px;border-radius:2px;background:var(--grid)}
.bnd.yes i{background:var(--bound);height:28px}
.bnd.no i{height:4px}
.bnd.in i{box-shadow:0 0 0 2px var(--sel)}
.pat{height:36px}
.pat .bar{position:absolute;left:1px;right:1px;top:15px;height:6px}
.pat .dot{position:relative;width:20px;height:20px;border-radius:4px;border:2px solid var(--surface)}
.glob{height:56px}
.glob .dot{width:22px;height:30px;border-radius:5px}
.glob.att .dot{opacity:.35}
.glob.recv .dot{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sel)}
.dep{height:30px}
.dep i{display:block;width:22px;height:20px;border-radius:3px}
.dep i.none{background:var(--sunk);border:1px dashed var(--rule)}
.out{height:44px}
.out .g{font:600 14px/1 var(--mono)}
.out .f{font:10px/1 var(--mono);color:var(--ink-3);margin-top:5px}
.out.fused .g{color:var(--bound)}
.out.fused::after{content:"";position:absolute;right:3px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--bound)}
.band{position:absolute;left:12px;right:12px;top:34px;height:28px;border-radius:6px;background:var(--sunk);border:1px solid var(--rule)}
.band span{position:absolute;right:10px;top:5px;font:11px var(--mono);color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}

.panel{position:sticky;top:76px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
@media (max-width:980px){.panel{position:static}}
.panel h3{font:600 1.25rem/1.2 var(--display)}
.formula{font:14px/1.5 var(--mono);background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.formula sub,.formula sup{font-size:.75em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.here{border-left:3px solid var(--sel);padding:4px 0 4px 10px;font-size:14px;color:var(--ink-2)}
.navbtns{display:flex;gap:8px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tok{display:inline-block;font:13px var(--mono);background:var(--sunk);border-radius:4px;padding:1px 5px;margin:1px 2px 1px 0;white-space:pre}

/* peek */
.strip{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px 0}
.strip .lbl{position:sticky;left:0;display:block;padding:2px 12px;font:600 12px var(--sans);color:var(--ink-2);white-space:nowrap}
.miss{box-shadow:inset 0 0 0 2px var(--no)!important;background:color-mix(in srgb,var(--no) 10%,transparent)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:14px 0}
.ctrl input[type=range]{width:min(260px,100%);accent-color:var(--sel)}
.meter{display:flex;align-items:baseline;gap:8px}
.meter b{font:600 1.6rem var(--mono);font-variant-numeric:tabular-nums}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
.toks{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.toks .t{font:14px var(--mono);white-space:pre;padding:2px 6px;border-radius:4px;background:var(--sunk)}
.toks .t.hot{background:var(--bound-tint);box-shadow:inset 0 -2px 0 var(--bound)}

/* decode */
.dec-grid{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));gap:2px;max-width:560px}
.dec-grid i{aspect-ratio:1;max-width:100%;border-radius:2px;background:var(--sunk)}
.dec-grid i.fz{background:color-mix(in srgb,var(--bound) 14%,var(--sunk))}
.dec-grid i.hit{background:var(--ink);outline:2px solid var(--sel)}
.dec-grid i.hit.fz{background:var(--bound)}
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.counter{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
.counter b{display:block;font:600 1.5rem var(--mono);font-variant-numeric:tabular-nums}
.counter span{font-size:12px;color:var(--ink-3)}
.log{font:13px/1.5 var(--mono);color:var(--ink-2);min-height:3em}
.emit .c{height:40px}
.emit .c.future{opacity:.22}
.emit .c.now{background:var(--sel-tint);box-shadow:inset 0 0 0 1.5px var(--sel)}
.emit .c .u{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px}

/* training */
.stages{display:flex;gap:6px;margin-bottom:14px}
.arch{display:grid;gap:6px;max-width:520px}
.blk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border:1.5px solid var(--ink);font-size:14px}
.blk.big{padding-block:20px}
.blk.frz{border-style:dashed;border-color:var(--frozen);color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--frozen) 14%,transparent) 6px 8px)}
.blk .st{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.losses{display:grid;gap:8px}
.loss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
.loss .lam{font:600 13px var(--mono);color:var(--ink-3)}
.loss.off{opacity:.4}
.budget{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:8px 0 4px;max-width:520px}
.budget i{display:block;height:100%}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:11px var(--sans)}
.chart .lab{fill:var(--ink-2);font:12px var(--sans)}
.chart .gl{stroke:var(--grid)}
.chart .ax{stroke:var(--rule)}
.chartbox{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;overflow-x:auto}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin:6px 0 10px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* quiz */
.quiz{display:grid;gap:14px;max-width:820px}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.q h3{margin-bottom:10px;font-weight:600}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--ink-3)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,var(--surface))}
.why{margin-top:8px;font-size:14px;color:var(--ink-2)}
footer{padding-block:40px 60px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-3)}
footer p{max-width:90ch}
.err{color:var(--no);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
